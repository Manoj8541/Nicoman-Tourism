<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 65" width="850" height="65">
  <defs>
    <!-- Vibrant Tropical Gradients (Zero Black, Zero White) -->
    <linearGradient id="brandCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <linearGradient id="coralSunset" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="50%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>

    <linearGradient id="emeraldLagoon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="violetNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Centered Clip Paths (Revealing centered text from left edge) -->
    <clipPath id="clipLine1">
      <rect x="200" y="0" width="0" height="65" class="rect-line-1" />
    </clipPath>

    <clipPath id="clipLine2">
      <rect x="120" y="0" width="0" height="65" class="rect-line-2" />
    </clipPath>

    <clipPath id="clipLine3">
      <rect x="125" y="0" width="0" height="65" class="rect-line-3" />
    </clipPath>

    <clipPath id="clipLine4">
      <rect x="145" y="0" width="0" height="65" class="rect-line-4" />
    </clipPath>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700;800&amp;display=swap');

      .typing-text {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 21px;
        letter-spacing: -0.2px;
      }

      /* ── Line 1: Centered at x=425 (Width 450px, starts x=200) ──── */
      .rect-line-1 {
        animation: animType1 24s linear infinite;
      }
      .group-line-1 {
        clip-path: url(#clipLine1);
      }

      @keyframes animType1 {
        0%, 1.5%    { width: 0px; }
        11.0%, 22.5%{ width: 450px; }
        24.0%, 100% { width: 0px; }
      }

      /* ── Line 2: Centered at x=425 (Width 610px, starts x=120) ──── */
      .rect-line-2 {
        animation: animType2 24s linear infinite;
      }
      .group-line-2 {
        clip-path: url(#clipLine2);
      }

      @keyframes animType2 {
        0%, 25.0%   { width: 0px; }
        26.5%       { width: 0px; }
        36.0%, 47.5%{ width: 610px; }
        49.0%, 100% { width: 0px; }
      }

      /* ── Line 3: Centered at x=425 (Width 600px, starts x=125) ──── */
      .rect-line-3 {
        animation: animType3 24s linear infinite;
      }
      .group-line-3 {
        clip-path: url(#clipLine3);
      }

      @keyframes animType3 {
        0%, 50.0%   { width: 0px; }
        51.5%       { width: 0px; }
        61.0%, 72.5%{ width: 600px; }
        74.0%, 100% { width: 0px; }
      }

      /* ── Line 4: Centered at x=425 (Width 560px, starts x=145) ──── */
      .rect-line-4 {
        animation: animType4 24s linear infinite;
      }
      .group-line-4 {
        clip-path: url(#clipLine4);
      }

      @keyframes animType4 {
        0%, 75.0%   { width: 0px; }
        76.5%       { width: 0px; }
        86.0%, 97.5%{ width: 560px; }
        99.0%, 100% { width: 0px; }
      }
    </style>
  </defs>

  <!-- ── LINE 1: 🏝️ Welcome to NICOMAN TOURISM! (Centered at 425) ──────── -->
  <g class="group-line-1">
    <text x="425" y="38" text-anchor="middle" class="typing-text" font-weight="700">
      <tspan fill="#FFA726">🏝️ Welcome to </tspan>
      <tspan fill="url(#brandCyan)" font-weight="800">NICOMAN</tspan>
      <tspan fill="#FF7043" font-weight="800"> TOURISM!</tspan>
    </text>
  </g>

  <!-- ── LINE 2: 🗺️ Explore Beaches, Islands & Historic Spots (Centered at 425) -->
  <g class="group-line-2">
    <text x="425" y="38" text-anchor="middle" class="typing-text" font-weight="700">
      <tspan fill="#00E676">🗺️ Explore </tspan>
      <tspan fill="url(#brandCyan)" font-weight="800">Beaches</tspan>
      <tspan fill="#FFA726">, </tspan>
      <tspan fill="#38BDF8" font-weight="800">Islands </tspan>
      <tspan fill="#FFD54F">&amp; </tspan>
      <tspan fill="#FF7043" font-weight="800">Historic Spots</tspan>
    </text>
  </g>

  <!-- ── LINE 3: ⛵ Book Ferry Tickets, Resorts & Island Stays (Centered at 425) -->
  <g class="group-line-3">
    <text x="425" y="38" text-anchor="middle" class="typing-text" font-weight="700">
      <tspan fill="#FF6B35">⛵ Book </tspan>
      <tspan fill="url(#brandCyan)" font-weight="800">Ferry Tickets</tspan>
      <tspan fill="#FFA726">, </tspan>
      <tspan fill="#34D399" font-weight="800">Resorts </tspan>
      <tspan fill="#FFD54F">&amp; </tspan>
      <tspan fill="#2DD4BF" font-weight="800">Island Stays</tspan>
    </text>
  </g>

  <!-- ── LINE 4: 🤖 Smart AI Guide for Travel Tips & Routes (Centered at 425) -->
  <g class="group-line-4">
    <text x="425" y="38" text-anchor="middle" class="typing-text" font-weight="700">
      <tspan fill="url(#violetNeon)" font-weight="800">🤖 Smart AI Guide </tspan>
      <tspan fill="#FFB74D">for </tspan>
      <tspan fill="url(#brandCyan)" font-weight="800">Travel Tips </tspan>
      <tspan fill="#00E676" font-weight="800">&amp; Routes</tspan>
    </text>
  </g>
</svg>
