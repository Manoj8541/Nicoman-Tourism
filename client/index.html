<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

  <!-- SEO Meta Tags -->
  <title>Andaman & Nicobar Tourism | Discover Paradise Islands</title>
  <meta name="description"
    content="Plan your dream vacation to Andaman & Nicobar Islands. Explore pristine beaches, book luxury hotels, check ferry schedules, and discover the best tourist attractions." />
  <meta name="keywords"
    content="Andaman, Nicobar, Tourism, Beach, Hotels, Ferry, Havelock, Port Blair, Radhanagar Beach" />
  <meta name="author" content="Andaman Tourism" />

  <!-- Theme Colors -->
  <meta name="theme-color" content="#14b8a6" />
  <meta name="msapplication-TileColor" content="#14b8a6" />

  <!-- Mobile Optimization -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Andaman Tourism" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Andaman & Nicobar Tourism | Discover Paradise" />
  <meta property="og:description"
    content="Your gateway to the most beautiful islands in India. Crystal clear waters, pristine beaches, and unforgettable experiences." />
  <meta property="og:image" content="/island.jpg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Leaflet CSS for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      z-index: 9999;
      transition: opacity 0.5s, visibility 0.5s;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      position: relative;
      width: 80px;
      height: 80px;
    }

    .loader::before,
    .loader::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .loader::before {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #14b8a6, #06b6d4);
      animation-delay: 0s;
    }

    .loader::after {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #14b8a6, #06b6d4);
      animation-delay: 0.5s;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(0.8);
        opacity: 1;
      }

      50% {
        transform: scale(1.2);
        opacity: 0.5;
      }
    }

    .loader-text {
      margin-top: 30px;
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #14b8a6, #06b6d4, #14b8a6);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmerText 2s linear infinite;
    }

    @keyframes shimmerText {
      0% {
        background-position: 0% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    /* Prevent FOUC */
    html {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>

<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader"></div>
    <p class="loader-text">NICOMAN TOURISM</p>
  </div>

  <!-- App Root -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

  <script>
    // Hide loading screen when app is ready
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('hidden');
      }, 1000);
    });
  </script>
</body>

</html>
