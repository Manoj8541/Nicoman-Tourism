name: Keep Supabase Active

on:
  schedule:
    # Runs automatically at 00:00 UTC every 6 days
    - cron: '0 0 */6 * *'
  workflow_dispatch: # Allows manual run test from GitHub Actions tab

jobs:
  ping:
    name: Ping Database & Backend
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Request
        run: |
          echo "Starting 6-day scheduled keep-alive ping..."
          
          # Ping the live API endpoint (internally queries Supabase DB, resetting the 7-day timer)
          # Zero hardcoded keys in YAML — safe for public repositories.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://nicoman-tourism.vercel.app/api/tourist-places")
          echo "Response Status Code: $HTTP_STATUS"
          
          # If status is 200 OK, exit successfully (GitHub stays silent, no notification)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Database query executed. Supabase 7-day inactivity timer reset."
            exit 0
          else
            echo "ERROR: Received HTTP $HTTP_STATUS. Marking workflow as failed to alert you."
            exit 1
          fi
