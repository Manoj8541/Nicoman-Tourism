name: Keep Supabase & Vercel Active

on:
  schedule:
    # Runs every 4 days at 04:00 UTC (well before the 7-day inactivity pause)
    - cron: '0 4 */4 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  keep-alive:
    name: Ping Supabase & Backend API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Website & Supabase Backend
        run: |
          echo "⏰ [$(date -u)] Starting Keep-Alive Ping..."
          
          # 1. Ping Vercel Serverless Endpoint (Triggers DB query)
          echo "📡 Pinging Live Vercel API..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nicoman-tourism.vercel.app/api/tourist-places")
          echo "   Vercel API Response: HTTP $HTTP_STATUS"
          
          # 2. Direct Ping to Supabase Database REST API
          echo "🗄️ Pinging Supabase Database directly..."
          SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            SUPABASE_ANON_KEY="your_supabase_anon_key_here"
          fi
          
          DB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://aojjkrpvzlmxylcyaddg.supabase.co/rest/v1/tourist_places?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "   Supabase REST API Response: HTTP $DB_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$DB_STATUS" -eq 200 ]; then
            echo "✅ Keep-Alive Ping Succeeded! Supabase project is active."
          else
            echo "⚠️ Non-200 response received, but request was registered on Supabase."
          fi
